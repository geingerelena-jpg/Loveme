<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Meter App</title>
  <link rel="stylesheet" href="style.css">
  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- STEP 1: Question -->
  <div class="card" id="questionCard">
    <div class="sticker">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHc3ZXB4YjVnYnh0M3B5aXByY3BsaGNvZjRncXpjcWJuYTBzbms1ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute Bear">
    </div>
    <h2 class="title">ခိခိကိုချစ်လား? 💖</h2>
    <div class="btn-group">
      <button id="yesBtn" onclick="startLoveMeter()">YES 💕</button>
      <button id="noBtn" onmouseover="moveNoBtn()" onclick="moveNoBtn()">NO ❌</button>
    </div>
  </div>

  <!-- STEP 2: Love Meter -->
  <div class="card hidden" id="meterCard">
    <div class="sticker">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHc3ZXB4YjVnYnh0M3B5aXByY3BsaGNvZjRncXpjcWJuYTBzbms1ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Happy Bear">
    </div>
    <h3 class="status-text" id="statusText">Measuring love level... 💕</h3>
    <div class="meter-display" id="meterDisplay">0%</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- STEP 3: Envelope -->
  <div class="card hidden" id="letterCard">
    <div class="envelope-wrapper" id="envelopeWrapper" onclick="openLetter()">
      <div class="envelope">
        <div class="envelope-flap"></div>
        <div class="sticker-on-envelope">
          <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHc3ZXB4YjVnYnh0M3B5aXByY3BsaGNvZjRncXpjcWJuYTBzbms1ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cat Sticker">
        </div>
        <h2>I KNEW IT! 😻</h2>
        <p class="love-subtitle">I love you 1000% 💌</p>
        <div class="click-hint">Click to open letter 👇</div>
      </div>

      <!-- Letter Popup Animation -->
      <div class="popup-letter" id="popupLetter">
        <div class="letter-content">
          <div class="letter-sticker">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHc3ZXB4YjVnYnh0M3B5aXByY3BsaGNvZjRncXpjcWJuYTBzbms1ciZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute Cat">
          </div>
          <h3>Dear Special Someone, 💖</h3>
          <p>
            ရင်ထဲမှာရှိတဲ့ ခံစားချက်တွေကို ချစ်ရသူမီကူလေး သိစေချင်ပါတယ်။ <br>
            အမြဲတမ်း ခိခိဘေးနားမှာ ရှိပေးလို့ ကျေးဇူးအများကြီးတင်ပါတယ်နော်။ 💕
          </p>
          <div class="signature">Forever Yours 💌</div>
          <button class="close-btn" onclick="event.stopPropagation(); closeLetter();">Click to close letter ✖</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
